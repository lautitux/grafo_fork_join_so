<!DOCTYPE html>
<html data-theme="light" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grafos Fork y Join</title>
  </head>
  <style>
    html,
    body {
      height: 99vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .container {
      display: grid;
      height: 100%;
      grid-template-columns: 100%;
      grid-template-rows: 10% 5% 80% 5%;
      grid-template-areas:
        "header"
        "tools"
        "content"
        "footer";
    }

    select, button {
      height: 2.5em;
    }

    main {
      display: grid;
      height: 100%;
      grid-template-columns: 1fr 1fr;
    }

    @media (max-width: 768px) {
      html, body {
        height: 100%;
      }

      main {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr 1fr;
      }
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #code-editor {
      position: relative;
      width: 100%;
      height: 100%;
      border: 1px solid gray;
    }

    #grafo {
      display: flex;
      justify-content: center;
      align-items: center;
      border: 1px solid gray;
    }
  </style>
  <body>
    <div class="container">
      <header style="grid-area: header">
        <h1>Fork y Join</h1>
        <a href="https://github.com/lautitux/grafo_fork_join_so" class="contrast">GitHub</a>
      </header>
      <section class="tools" style="grid-area: tools">  
        <label for="select-ejemplo">Cargar ejemplo:</label>
        <select name="select-ejemplo" id="select-ejemplo">
          <option value="none">Ninguno</option>
        </select>
        <button id="render">Dibujar Grafo</button>
      </section>
      <main style="grid-area: content">
        <div id="code-editor"></div>
        <div id="grafo"></div>
      </main>
      <footer style="grid-area: footer"></footer>
    </div>
  </body>
  <script type="module">
    import ace from "https://cdn.jsdelivr.net/npm/ace-builds@1.43.3/+esm";
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11.12.0/+esm";
    import { make_graph, make_mermaid_graph } from "./gleam_bundle.mjs";
    import { load_ace_mode } from "./ace_mode.mjs";
    import { EXAMPLES, load_examples } from "./examples.mjs";

    mermaid.initialize({ startOnLoad: false });

    load_ace_mode();
    load_examples();

    let editor = ace.edit(document.getElementById("code-editor"), {
      mode: "ace/mode/fork_join",
      selectionStyle: "text",
    });

    async function renderGraph() {
      let code = editor.getValue();
      console.log(code);
      try {
        let graph = make_graph(code);
        let mermaid_js_code = make_mermaid_graph(graph);
        console.log(mermaid_js_code);
        const { svg } = await mermaid.render("grafoSvg", mermaid_js_code);
        document.getElementById("grafo").innerHTML = svg;

        console.log(svg);
        localStorage.setItem("editor-content", code);
      } catch (e) {
        alert(e);
      }
    }

    let select = document.getElementById("select-ejemplo");
    select.onchange = () => {
      if (select.value != "none") {
        editor.setValue(EXAMPLES[select.value]);
        renderGraph();
      }
    };

    let previousContent = localStorage.getItem("editor-content");
    if (previousContent) {
      editor.setValue(previousContent);
    }

    document.getElementById("render").onclick = async () => {
      renderGraph();
    };
  </script>
</html>
